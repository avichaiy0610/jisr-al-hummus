<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ג׳יסר א־חומוס · איפה הבית שלי?</title>
  <meta name="description" content="כפר דמיוני על החוף: כל מי שעוקב אחרי ג׳יסר א־חומוס באינסטגרם מקבל בית. מועצה מקומית · מרכז מידע לתושב.">
  <meta property="og:title" content="ג׳יסר א־חומוס · איפה הבית שלי?">
  <meta property="og:description" content="כל עוקב מקבל בית. מספר הבית לא משתנה לעולם, גם אם הפקיד מתעקש.">
  <meta property="og:image" content="https://avichaiy0610.github.io/jisr-al-hummus/og.png">
  <meta property="og:url" content="https://avichaiy0610.github.io/jisr-al-hummus/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f6ecd8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧆</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }
  </script>
</head>
<body>
  <canvas id="village" aria-label="מפת הכפר בתלת־ממד"></canvas>

  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">🧆</span>
      <div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
    </div>
    <p class="counter" id="counter" aria-live="polite"></p>
  </header>

  <section class="sheet" id="sheet" aria-live="polite" hidden>
    <button class="close" id="close" aria-label="סגירה"><svg><use href="#i-x"/></svg></button>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <nav class="tabs" id="tabs" aria-label="ניווט">
    <button data-tab="search"><svg><use href="#i-find"/></svg><span></span></button>
    <button data-tab="mine"><svg><use href="#i-home"/></svg><span></span></button>
    <button data-tab="people"><svg><use href="#i-people"/></svg><span></span></button>
    <button data-tab="more"><svg><use href="#i-more"/></svg><span></span></button>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>

  <div class="loading" id="loading">
    <div class="loading-inner">
      <div class="bowl" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="loading-title">ג׳יסר א־חומוס</p>
      <p class="loading-joke" id="joke"></p>
    </div>
  </div>

  <noscript><p class="noscript">הכפר צריך JavaScript. אבו־ג׳מיל מתנצל.</p></noscript>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-find" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h12V9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="10" y="14" width="4" height="6" fill="currentColor"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M16 5.2a3.4 3.4 0 0 1 0 6.6M18 14.8c1.8.7 3 2.4 3.5 5.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  </svg>

  <script type="module" src="js/main.js"></script>
</body>
</html>
